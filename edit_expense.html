<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2>Edit Expense ✏️</h2>

    <form method="POST">

        <label>Category</label>
        <input type="text"
               name="category"
               value="{{ expense[3] }}"
               class="form-control"
               required>

        <br>

        <label>Amount</label>
        <input type="number"
               name="amount"
               value="{{ expense[2] }}"
               class="form-control"
               required>

        <br>

        <label>Date</label>
        <input type="date"
               name="date"
               value="{{ expense[4] }}"
               class="form-control"
               required>

        <br>

        <label>Description</label>
        <textarea name="description"
                  class="form-control">{{ expense[5] }}</textarea>

        <br>

        <button type="submit" class="btn btn-primary">
            Update Expense
        </button>

        <a href="/dashboard" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
