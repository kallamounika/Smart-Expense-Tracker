<!DOCTYPE html>
<html>
<head>
    <title>Edit Income</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Edit Income ✏️</h2>

<form method="POST">

    <label>Category</label>

    <input type="text"
           name="category"
           value="{{ income[3] }}"
           class="form-control"
           required>

    <br>

    <label>Amount</label>

    <input type="number"
           name="amount"
           value="{{ income[2] }}"
           class="form-control"
           required>

    <br>

    <label>Date</label>

    <input type="date"
           name="date"
           value="{{ income[4] }}"
           class="form-control"
           required>

    <br>

    <button class="btn btn-success">
        Update Income
    </button>

    <a href="/dashboard" class="btn btn-secondary">
        Cancel
    </a>

</form>

</div>

</body>
</html>
